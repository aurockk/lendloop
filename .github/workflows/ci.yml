name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=moderate
      - name: Build
        run: npm run build
        env:
          # Build-time only placeholders; no real deployment is touched.
          NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      - name: Workflow JSON contains no secrets
        run: |
          ! grep -RInE '"(password|apiKey|secret)"\s*:\s*"[^"]+' n8n/workflows/
